<!DOCTYPE html>
<html>
<head>
    <title>清除 ACME 缓存</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #c0392b;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>清除 ACME 缓存</h1>
    <p>如果 ACME 证书申请一直失败，可以尝试清除缓存的账户密钥，重新生成。</p>
    <button onclick="clearCache()">清除 ACME 缓存</button>
    <div id="result"></div>

    <script>
        function clearCache() {
            const prefixes = ['acme_account_key_', 'acme_account_url_'];
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && prefixes.some(prefix => key.startsWith(prefix))) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            const sessionKeysToRemove = [];
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key && prefixes.some(prefix => key.startsWith(prefix))) {
                    sessionKeysToRemove.push(key);
                }
            }
            sessionKeysToRemove.forEach(key => sessionStorage.removeItem(key));
            localStorage.removeItem('browser_fingerprint');

            const result = document.getElementById('result');
            result.className = 'result success';
            result.textContent = `✓ 已清除 ${keysToRemove.length + sessionKeysToRemove.length} 条 ACME 账户缓存，请返回主页重新申请。`;
        }
    </script>
</body>
</html>
